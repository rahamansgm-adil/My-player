<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Player</title>
    <style>
        /* This removes margins so it fits perfectly inside your iframe */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Styles the dropdown menu to float at the top */
        .controls { position: absolute; top: 10px; right: 10px; z-index: 10; }
        select { background: rgba(0,0,0,0.7); color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; cursor: pointer; outline: none; }
        select:hover { background: rgba(0,0,0,0.9); }

        /* The actual video player fills the whole screen behind the dropdown */
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div class="controls">
        <select id="serverDropdown" onchange="changeServer()">
            <!-- We store the Movie URL in 'data-movie' and TV URL in 'data-tv' -->
            <option value="vidsrc" 
                data-movie="https://vidsrc.sbs/embed/movie/{tmdb_id}?autoplay=1" 
                data-tv="https://vidsrc.sbs/embed/tv/{tmdb_id}/{season}/{episode}?autoplay=1">
                Server 1 (VidSrc)
            </option>
            <option value="vidcore" 
                data-movie="https://vidcore.org/embed/movie/{tmdb_id}" 
                data-tv="https://vidcore.org/embed/tv/{tmdb_id}/{season}/{episode}">
                Server 2 (VidCore)
            </option>
            <option value="cinezo" 
                data-movie="https://player.cinezo.live/embed/movie/{tmdb_id}" 
                data-tv="https://player.cinezo.live/embed/tv/{tmdb_id}/{season}/{episode}">
                Server 3 (Cinezo)
            </option>
            <!-- Add the rest of your servers here using the same format -->
        </select>
    </div>

    <iframe id="videoFrame" allowfullscreen></iframe>

    <script>
        // 1. Grab the TMDB ID, Season, and Episode from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const tmdb_id = urlParams.get('tmdb');
        const season = urlParams.get('s');
        const episode = urlParams.get('e');

        function changeServer() {
            const dropdown = document.getElementById("serverDropdown");
            const selectedOption = dropdown.options[dropdown.selectedIndex];
            
            let finalUrl = "";

            // 2. Check if it is a TV show or a Movie based on URL parameters
            if (season && episode) {
                // It's a TV Show
                finalUrl = selectedOption.getAttribute("data-tv")
                    .replace("{tmdb_id}", tmdb_id)
                    .replace("{season}", season)
                    .replace("{episode}", episode);
            } else {
                // It's a Movie
                finalUrl = selectedOption.getAttribute("data-movie")
                    .replace("{tmdb_id}", tmdb_id);
            }

            // 3. Load the URL into the iframe
            document.getElementById("videoFrame").src = finalUrl;
        }

        // Load the first server automatically when it boots up
        window.onload = changeServer;
    </script>
</body>
</html>
