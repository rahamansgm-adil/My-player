<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Player (TV & Mobile Optimized)</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }

        /* Positions the container exactly in the TOP MIDDLE, taking up only 50x50 pixels */
        .controls { 
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 10; 
            width: 50px; 
            height: 50px;
            transition: opacity 0.4s ease-in-out; 
        }
        
        /* Applied automatically after 5 seconds */
        .controls.hidden {
            opacity: 0;
            /* We DO NOT use pointer-events: none here, so the invisible 50x50 square can still be tapped to wake it up */
        }
        
        /* Disable the actual dropdown menu while it's hidden so the wake-up tap doesn't open the list */
        .controls.hidden select {
            pointer-events: none;
        }
        
        select { 
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            opacity: 0.01; /* Invisible but clickable */
            cursor: pointer; 
            outline: none;
            z-index: 2;
        }
        
        .icon-wrapper {
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            border: 2px solid #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
            pointer-events: none; 
        }

        select:focus + .icon-wrapper {
            border-color: #00BFFF;
            background: #111;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.8);
            transform: scale(1.15);
        }

        #tv-toast {
            position: fixed; 
            bottom: 50px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(0, 191, 255, 0.9); 
            color: white; 
            padding: 12px 30px;
            border-radius: 8px; 
            font-size: 20px; 
            font-weight: bold;
            opacity: 0; 
            transition: opacity 0.3s; 
            pointer-events: none; 
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 0; }
    </style>
</head>
<body>

    <!-- The Top Middle Icon Button -->
    <div class="controls" id="menuContainer">
        
        <select id="serverDropdown" onchange="changeServer()" autofocus>
            <option value="vidsrc" data-movie="https://vidsrc.sbs/embed/movie/{tmdb_id}?autoplay=1" data-tv="https://vidsrc.sbs/embed/tv/{tmdb_id}/{season}/{episode}?autoplay=1">vidsrc (Default)</option>
            <option value="111movies" data-movie="https://111movies.net/movie/{tmdb_id}" data-tv="https://111movies.net/tv/{tmdb_id}/{season}/{episode}">111movies</option>
            <option value="2embed" data-movie="https://www.2embed.cc/embed/{tmdb_id}" data-tv="https://www.2embed.skin/embedtv/{tmdb_id}&s={season}&e={episode}">2embed</option>
            <option value="cinesrc" data-movie="https://cinesrc.st/embed/movie/{tmdb_id}?s=1&e=1&color=FF1493&autoplay=true&autonext=true" data-tv="https://cinesrc.st/embed/tv/{tmdb_id}?s={season}&e={episode}&color=FF1493&autoplay=true&autonext=true">cinesrc</option>
            <option value="cinezo" data-movie="https://player.cinezo.live/embed/movie/{tmdb_id}" data-tv="https://player.cinezo.live/embed/tv/{tmdb_id}/{season}/{episode}">cinezo</option>
            <option value="embedmaster" data-movie="https://embedmaster.link/1o0iqztipj3gso39/movie/{tmdb_id}" data-tv="https://embedmaster.link/1o0iqztipj3gso39/tv/{tmdb_id}/{season}/{episode}">embedmaster</option>
            <option value="filmu" data-movie="https://embed.filmu.in/movie/{tmdb_id}" data-tv="https://embed.filmu.in/tv/{tmdb_id}/{season}/{episode}">filmu</option>
            <option value="multiembed" data-movie="https://multiembed.mov/?video_id={tmdb_id}&tmdb=1" data-tv="https://multiembed.mov/?video_id={tmdb_id}&tmdb=1&s={season}&e={episode}">multiembed</option>
            <option value="nxsha" data-movie="https://nxsha.space/embed/movie/{tmdb_id}" data-tv="https://nxsha.space/embed/tv/{tmdb_id}/{season}/{episode}">nxsha</option>
            <option value="peachify" data-movie="https://peachify.pro/embed/movie/{tmdb_id}" data-tv="https://peachify.pro/embed/tv/{tmdb_id}/{season}/{episode}">peachify</option>
            <option value="vidbolt" data-movie="https://vidbolt.pro/movie/{tmdb_id}?autoPlay=true" data-tv="https://vidbolt.pro/tv/{tmdb_id}/{season}/{episode}?autoPlay=true">vidbolt</option>
            <option value="vidcore" data-movie="https://vidcore.org/embed/movie/{tmdb_id}" data-tv="https://vidcore.org/embed/tv/{tmdb_id}/{season}/{episode}">vidcore</option>
            <option value="videasy" data-movie="https://player.videasy.net/movie/{tmdb_id}" data-tv="https://player.videasy.net/tv/{tmdb_id}/{season}/{episode}">videasy</option>
            <option value="vidfast" data-movie="https://vidfast.vc/movie/{tmdb_id}?autoPlay=true" data-tv="https://vidfast.vc/tv/{tmdb_id}/{season}/{episode}?autoPlay=true">vidfast</option>
            <option value="vidking" data-movie="https://www.vidking.net/embed/movie/{tmdb_id}?autoPlay=true&nextEpisode=true&episodeSelector=true" data-tv="https://www.vidking.net/embed/tv/{tmdb_id}/{season}/{episode}?autoPlay=true&nextEpisode=true&episodeSelector=true">vidking</option>
            <option value="vidlink" data-movie="https://vidlink.pro/movie/{tmdb_id}?primaryColor=63b8bc&secondaryColor=a2a2a2&iconColor=eefdec&icons=default&player=jw&title=true&poster=true&autoplay=true&nextbutton=true" data-tv="https://vidlink.pro/tv/{tmdb_id}/{season}/{episode}?primaryColor=63b8bc&secondaryColor=a2a2a2&iconColor=eefdec&icons=default&player=jw&title=true&poster=true&autoplay=true&nextbutton=true">vidlink</option>
            <option value="vidnest" data-movie="https://vidnest.fun/movie/{tmdb_id}" data-tv="https://vidnest.fun/tv/{tmdb_id}/{season}/{episode}">vidnest</option>
            <option value="vidsrc-embed" data-movie="https://vidsrc-embed.ru/embed/movie?tmdb={tmdb_id}" data-tv="https://vidsrc-embed.ru/embed/tv?tmdb={tmdb_id}&season={season}&episode={episode}">vidsrc-embed</option>
            <option value="zxcstream" data-movie="https://test.zxcstream.xyz/player/movie/{tmdb_id}?server=0&debug=false&subLang=english" data-tv="https://test.zxcstream.xyz/player/tv/{tmdb_id}/{season}/{episode}?server=0&debug=false&subLang=english">zxcstream</option>
        </select>

        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                <line x1="6" y1="6" x2="6.01" y2="6"></line>
                <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
        </div>

    </div>

    <div id="tv-toast">Switched Server</div>

    <iframe id="videoFrame" allowfullscreen></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tmdb_id = urlParams.get('tmdb');
        const season = urlParams.get('s');
        const episode = urlParams.get('e');

        let idleTimer;
        const menuContainer = document.getElementById("menuContainer");
        const dropdown = document.getElementById("serverDropdown");
        
        function wakeUpMenu() {
            if (menuContainer.classList.contains("hidden")) {
                menuContainer.classList.remove("hidden");
                dropdown.focus();
            }

            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                menuContainer.classList.add("hidden");
            }, 5000); 
        }

        // Only tapping the exact 50x50 area of the button wakes it up now
        menuContainer.addEventListener("touchstart", (e) => {
            if (menuContainer.classList.contains("hidden")) {
                e.preventDefault(); // Prevents the dropdown from opening on the wake-up tap
                wakeUpMenu();
            }
        });
        
        menuContainer.addEventListener("mousedown", (e) => {
            if (menuContainer.classList.contains("hidden")) {
                e.preventDefault();
                wakeUpMenu();
            }
        });

        // Desktop mouse movement still wakes it up anywhere
        window.addEventListener("mousemove", wakeUpMenu);

        // UI & TV LOGIC
        function showToast(text) {
            const toast = document.getElementById("tv-toast");
            toast.innerText = "Switched to: " + text;
            toast.style.opacity = "1";
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => { toast.style.opacity = "0"; }, 3000);
        }

        function changeServer() {
            const selectedOption = dropdown.options[dropdown.selectedIndex];
            let finalUrl = "";

            if (season && episode) {
                finalUrl = selectedOption.getAttribute("data-tv")
                    .replace("{tmdb_id}", tmdb_id)
                    .replace("{season}", season)
                    .replace("{episode}", episode);
            } else {
                finalUrl = selectedOption.getAttribute("data-movie")
                    .replace("{tmdb_id}", tmdb_id);
            }

            document.getElementById("videoFrame").src = finalUrl;
            showToast(selectedOption.text);
            
            wakeUpMenu();
        }

        // ANDROID TV D-PAD LOGIC
        document.addEventListener('keydown', function(e) {
            if (menuContainer.classList.contains("hidden")) {
                e.preventDefault();
                wakeUpMenu();
                return;
            }

            wakeUpMenu();
            
            if (document.activeElement === dropdown) {
                let currentIndex = dropdown.selectedIndex;
                let maxIndex = dropdown.options.length - 1;

                if (e.key === "ArrowRight") {
                    e.preventDefault();
                    dropdown.selectedIndex = currentIndex < maxIndex ? currentIndex + 1 : 0;
                    changeServer();
                } else if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    dropdown.selectedIndex = currentIndex > 0 ? currentIndex - 1 : maxIndex;
                    changeServer();
                }
            }
        });

        // Load default player
        window.onload = () => {
            const selectedOption = dropdown.options[dropdown.selectedIndex];
            
            let finalUrl = season && episode 
                ? selectedOption.getAttribute("data-tv").replace("{tmdb_id}", tmdb_id).replace("{season}", season).replace("{episode}", episode)
                : selectedOption.getAttribute("data-movie").replace("{tmdb_id}", tmdb_id);

            document.getElementById("videoFrame").src = finalUrl;
            
            wakeUpMenu(); 
        };
    </script>
</body>
</html>
